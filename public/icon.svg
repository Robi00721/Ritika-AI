<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0817" />
      <stop offset="50%" stop-color="#190e38" />
      <stop offset="100%" stop-color="#07050d" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#9333ea" stroke-width="6" stroke-opacity="0.5" />

  <!-- Outer Neon Glow Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#purpleGlow)" stroke-width="8" opacity="0.4" filter="url(#glow)" />

  <!-- Letter R and lightning bolt design -->
  <g filter="url(#glow)" transform="translate(140, 110)">
    <!-- Letter R -->
    <path d="M 40 40 L 120 40 C 165 40, 195 65, 195 105 C 195 145, 165 170, 120 170 L 40 170 Z M 85 80 L 85 130 L 115 130 C 135 130, 150 120, 150 105 C 150 90, 135 80, 115 80 Z" fill="url(#purpleGlow)" />
    <path d="M 40 40 L 85 40 L 85 240 L 40 240 Z" fill="url(#purpleGlow)" />
    <path d="M 110 160 L 185 240 L 135 240 L 70 170 Z" fill="url(#purpleGlow)" />

    <!-- Lightning Bolt -->
    <polygon points="175,70 230,70 195,135 235,135 160,225 180,150 145,150" fill="#f472b6" />
  </g>
</svg>
